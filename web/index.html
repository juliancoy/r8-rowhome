<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R8 Rowhome Viewer</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <section class="viewport">
        <canvas id="viewport" width="1280" height="800"></canvas>
        <div id="status" class="status">Loading model...</div>
      </section>
      <aside class="panel">
        <h1>R8 Rowhome</h1>
        <div class="controls">
          <button id="reset-camera" type="button">Reset Camera</button>
        </div>
        <h2>Components</h2>
        <div id="components" class="list"></div>
        <h2>Bill of Materials</h2>
        <div id="bom" class="list"></div>
        <h2>Validation</h2>
        <div id="validation" class="list"></div>
      </aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
